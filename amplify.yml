# Monorepo build spec for AWS Amplify Hosting.
# Each Amplify app must set AMPLIFY_MONOREPO_APP_ROOT to match one appRoot below
# (web | mobile). See README.md for deploy notes per app.
#
# landing/ is deprecated — waitlist is served from web/ at /app/waitlist.
# Remove the landing Amplify app in the console after radvisor.com redirects are live.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*

  - appRoot: mobile
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npx expo export -p web
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
